name: Build and Release

on:
  workflow_dispatch:

  release:
    types: [published]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        # Define the OS and architecture combinations
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
        include:
          # For Android ARM 8 (added in your original build.sh as a specific case)
          - goos: android
            goarch: arm64
            # anet (pulled in transitively via pion) uses //go:linkname to the
            # private net.zoneCache on android; the Go 1.23+ linker rejects this
            # ("invalid reference to net.zoneCache"). Relax the check for android.
            extra_ldflags: "-checklinkname=0"
          # 32-bit ARM hard-float (v7): routers, Pi 2/3 on a 32-bit OS.
          # GOARCH=arm needs GOARM to say which ARM version it targets.
          - goos: linux
            goarch: arm
            goarm: 7
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Show workflow information
        run: |
          export _NAME=$(jq ".[\"$GOOS-$GOARCH$GOARM$GOMIPS\"].friendlyName" -r < .github/build/friendly-filenames.json)
          echo "GOOS: $GOOS, GOARCH: $GOARCH, GOARM: $GOARM, GOMIPS: $GOMIPS, RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download Project dependencies
        run: go mod download

      - name: Generate compressed frontend assets
        run: GOOS=$(go env GOHOSTOS) GOARCH=$(go env GOHOSTARCH) go generate ./web

      - name: Verify embedded frontend
        # web embeds dist-gzip; a build without it fails (or ships no UI).
        run: test -s web/dist-gzip/index.html.gz

      - name: Build the application
        run: |
          mkdir -p build_assets
          # Stamp the version so `xray-knife -V` reports the tag it was built from.
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
            VERSION="${VERSION#v}"
          fi
          go build -v -trimpath -o build_assets/xray-knife -tags="with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_grpc" -ldflags "-s -w -buildid= -X github.com/lilendian0x00/xray-knife/v11/cmd.version=${VERSION} ${{ matrix.extra_ldflags }}"

      - name: Rename Windows binary
        if: matrix.goos == 'windows'
        run: |
          mv ./build_assets/xray-knife ./build_assets/xray-knife.exe

      - name: Copy README.md & LICENSE
        run: |
          cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md
          cp ${GITHUB_WORKSPACE}/LICENSE ./build_assets/LICENSE

      - name: Create ZIP archive
        shell: bash
        run: |
          pushd build_assets || exit 1
          touch -mt $(date +%Y01010000) *
          zip -9vr ../Xray-knife-${{ env.ASSET_NAME }}.zip .
          popd || exit 1
          FILE=./Xray-knife-${{ env.ASSET_NAME }}.zip
          DGST=$FILE.dgst
          for METHOD in md5 sha1 sha256 sha512
          do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$DGST
          done

      - name: Rename build directory
        run: |
          mv build_assets Xray-knife-${{ env.ASSET_NAME }}

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Xray-knife-${{ env.ASSET_NAME }}
          path: ./Xray-knife-${{ env.ASSET_NAME }}/*

      - name: Upload zip for the checksum job
        uses: actions/upload-artifact@v4
        with:
          name: zip-${{ env.ASSET_NAME }}
          path: ./Xray-knife-${{ env.ASSET_NAME }}.zip

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./Xray-knife-${{ env.ASSET_NAME }}.zip*
          tag: ${{ github.ref }}
          file_glob: true

  checksums:
    # One SHA256SUMS for every release zip, verifiable with
    # `sha256sum -c --ignore-missing SHA256SUMS`.
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download release zips
        uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          merge-multiple: true
          path: dist

      - name: Write SHA256SUMS
        run: |
          cd dist
          sha256sum Xray-knife-*.zip | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS

      - name: Upload SHA256SUMS to release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/SHA256SUMS
          tag: ${{ github.ref }}